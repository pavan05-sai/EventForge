<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Event Management System - Login and Register">
    <title>Event Manager - Login</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <!-- ====================================
         Login / Register Page
         ====================================
         This is the first page users see.
         They can switch between Login and Register tabs.
    -->
    <div class="auth-container">
        <div class="auth-card">
            <h1>📅 Event Manager</h1>
            <p class="subtitle">Manage and schedule your events efficiently</p>

            <!-- Tab buttons to switch between Login and Register -->
            <div class="auth-tabs">
                <button class="active" onclick="showTab('login')" id="login-tab">Login</button>
                <button onclick="showTab('register')" id="register-tab">Register</button>
            </div>

            <!-- Login Form -->
            <form id="login-form" onsubmit="handleLogin(event)">
                <div id="login-alert"></div>
                <div class="form-group">
                    <label for="login-email">Email Address</label>
                    <input type="email" id="login-email" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block" id="login-btn">
                    Login
                </button>
            </form>

            <!-- Register Form (hidden by default) -->
            <form id="register-form" class="hidden" onsubmit="handleRegister(event)">
                <div id="register-alert"></div>
                <div class="form-group">
                    <label for="register-name">Full Name</label>
                    <input type="text" id="register-name" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label for="register-email">Email Address</label>
                    <input type="email" id="register-email" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label for="register-password">Password</label>
                    <input type="password" id="register-password" placeholder="At least 6 characters" required minlength="6">
                </div>
                <div class="form-group">
                    <label for="register-confirm">Confirm Password</label>
                    <input type="password" id="register-confirm" placeholder="Re-enter password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block" id="register-btn">
                    Create Account
                </button>
            </form>

            <p class="text-center mt-20" style="font-size: 13px; color: var(--gray-400);">
                A simple event management system for learning
            </p>
        </div>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>

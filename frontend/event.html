<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create or Edit Event">
    <title>Create Event - Event Manager</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <button class="menu-toggle" onclick="toggleSidebar()">☰</button>

    <div class="app-container">
        <!-- Sidebar -->
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>📅 Event Manager</h2>
                <p>Manage your events</p>
            </div>
            <ul class="sidebar-nav">
                <li><a href="/dashboard"><span class="icon">🏠</span> Dashboard</a></li>
                <li><a href="/event" class="active"><span class="icon">➕</span> Create Event</a></li>
                <li id="admin-link" class="hidden"><a href="/admin"><span class="icon">⚙️</span> Admin Panel</a></li>
            </ul>
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar" id="user-avatar">U</div>
                    <div>
                        <div class="user-name" id="user-name">User</div>
                        <div class="user-role" id="user-role">user</div>
                    </div>
                </div>
                <button class="btn btn-outline btn-sm btn-block" onclick="handleLogout()">🚪 Logout</button>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <div class="page-header">
                <h1 id="page-title">Create New Event</h1>
                <a href="/dashboard" class="btn btn-outline">← Back to Dashboard</a>
            </div>

            <div class="card" style="max-width: 700px;">
                <form id="event-form" onsubmit="handleSubmit(event)">
                    <div id="form-alert"></div>

                    <div class="form-group">
                        <label for="event-title">Event Title *</label>
                        <input type="text" id="event-title" placeholder="e.g., Team Meeting" required>
                    </div>

                    <div class="form-group">
                        <label for="event-description">Description</label>
                        <textarea id="event-description" placeholder="What is this event about?"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="event-date">Date *</label>
                        <input type="date" id="event-date" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="event-start">Start Time *</label>
                            <input type="time" id="event-start" required>
                        </div>
                        <div class="form-group">
                            <label for="event-end">End Time *</label>
                            <input type="time" id="event-end" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="event-location">Location</label>
                        <input type="text" id="event-location" placeholder="e.g., Conference Room A or Zoom link">
                    </div>

                    <!-- Status field (only shown when editing) -->
                    <div class="form-group hidden" id="status-group">
                        <label for="event-status">Status</label>
                        <select id="event-status">
                            <option value="upcoming">Upcoming</option>
                            <option value="completed">Completed</option>
                            <option value="cancelled">Cancelled</option>
                        </select>
                    </div>

                    <div class="flex gap-10 mt-20">
                        <button type="submit" class="btn btn-primary" id="submit-btn">
                            ➕ Create Event
                        </button>
                        <a href="/dashboard" class="btn btn-outline">Cancel</a>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/event.js"></script>
</body>
</html>
